name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned analysis and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic verification tests
        run: python -m pytest tests -q -rs
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '2'

